name: Coursekin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm audit --prefix web --audit-level=low
      - run: node --test tests/browser-data.test.mjs web/test/*.test.mjs
      - run: npm run build --prefix web
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Verify clean launcher setup
        run: python -c "import bootstrap; bootstrap.prepare()"
      - run: python package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: coursekin-${{ matrix.os }}
          path: dist/*.zip
